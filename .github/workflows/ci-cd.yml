name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and Run Tests
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://${{ secrets.PGHOST }}:${{ secrets.PGPORT }}/${{ secrets.PGDATABASE }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.PGUSER }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.PGPASSWORD }}
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRATION: 86400000
          JWT_ACCESS_EXPIRATION: 86400000
        # Заменили ./gradlew build на чистый билд. Теперь Gradle соберет jar и прогонит тесты, не зная про существование Checkstyle
        run: ./gradlew clean build

  push-to-dockerhub:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/fintrack-api:latest

  deploy-to-railway:
    needs: push-to-dockerhub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: railway redeploy --service fintrack-api -y
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  production-healthcheck:
    needs: deploy-to-railway
    runs-on: ubuntu-latest
    steps:
      - name: Wait for service startup
        run: sleep 30

      - name: Check API Status
        run: |
          STATUS_CODE=$(curl -o /dev/null -s -w "%{http_code}" https://fintrack-api-production.up.railway.app/actuator/health)
          if [ "$STATUS_CODE" -ne 200 ]; then
            echo "Healthcheck failed with status $STATUS_CODE"
            exit 1
          else
            echo "Production is healthy! Status code: $STATUS_CODE"
          fi